  <text x="150" y="303" fill="#2f2925" font-family="Georgia, serif" font-size="28">Kuzuha Station</text>
  <text x="150" y="333" fill="#746b63" font-family="Arial, sans-serif" font-size="15">Station building</text>

  <rect x="136" y="360" width="214" height="76" rx="3" fill="#fffaf1" stroke="#b9aa99" stroke-width="2"/>
  <circle cx="173" cy="398" r="18" fill="#a35f3b"/>
