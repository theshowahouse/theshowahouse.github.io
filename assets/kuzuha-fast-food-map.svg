<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Fast food around Kuzuha Station</title>
  <desc id="desc">A simple location diagram showing MOS Burger in the Kuzuha Station building and McDonald’s and KFC in Kuzuha Mall beside the station.</desc>
