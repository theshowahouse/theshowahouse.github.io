  <text x="70" y="112" fill="#746b63" font-family="Arial, sans-serif" font-size="16" letter-spacing="1.6">ALL THREE ARE IN THE STATION AREA</text>

  <path d="M70 208 H1130" fill="none" stroke="#d3c7b8" stroke-width="32"/>
  <path d="M70 208 H1130" fill="none" stroke="#faf7f0" stroke-width="26"/>
